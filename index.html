<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Jarvis Station</title>
<link rel="stylesheet" href="css/station.css?v=3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="css/cas-identity.css"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icons/apple-touch-icon.png"><meta name="theme-color" content="#241917"></head>
<body>

<!-- HEADER -->
<header class="station-header">
  <span class="station-title">Jarvis Station</span>
  <span class="station-subtitle">Autonomous Revenue Fortress</span>
  <div class="header-stats" id="header-stats">
    <span class="header-stat">Loading..</span>
  </div>
</header>

<!-- METRICS BAR -->
<div class="metrics-bar" id="metrics-bar">
  <div class="metric"><span class="metric-val" id="m-days">--</span><span class="metric-lbl">DAYS</span></div>
  <div class="metric"><span class="metric-val" id="m-budget">--</span><span class="metric-lbl">BUDGET</span></div>
  <div class="metric"><span class="metric-val" id="m-services">--</span><span class="metric-lbl">SERVICES</span></div>
  <div class="metric"><span class="metric-val" id="m-posts">--</span><span class="metric-lbl">LIVE</span></div>
  <div class="metric"><span class="metric-val" id="m-revenue">$0</span><span class="metric-lbl">REVENUE</span></div>
</div>

<div id="cas-root" class="station-cas-sheet" hidden><button id="station-cas-close" type="button">Close Cas</button></div><button id="station-cas-toggle" type="button" aria-label="Open Cas" aria-expanded="false"><img src="assets/cas/current.png" alt=""></button><!-- CANVAS MAP -->
<div class="station-main">
  <canvas id="station-canvas"></canvas>
</div>

<!-- ROOM DETAIL OVERLAY -->
<div class="room-overlay" id="room-overlay"></div>

<!-- TAB PANELS -->
<div class="tab-panel" id="panel-missions"></div>
<div class="tab-panel" id="panel-content-review"></div>
<div class="tab-panel" id="panel-agents"></div>
<div class="tab-panel" id="panel-log"></div>
<div class="tab-panel" id="panel-settings"></div>
<div class="tab-panel" id="panel-store"><div class="future-lock"><div class="icon">◆</div>FUTURE: Store<br>Trigger: First $100 MRR</div></div>
<div class="tab-panel" id="panel-achievements"><div class="future-lock"><div class="icon">★</div>FUTURE: Achievements<br>Trigger: First sale event</div></div>
<div class="tab-panel" id="panel-inventory"><div class="future-lock"><div class="icon">▦</div>FUTURE: Inventory<br>Trigger: 5+ agent vault notes</div></div>

<!-- BOTTOM NAV -->
<nav class="station-nav" id="station-nav"></nav>

<!-- SCRIPTS (ES Modules) -->
<script type="module" src="js/app.js?v=cas21"></script>

<script type="module" src="js/pwa.js?v=cas21"></script></body>
</html>
