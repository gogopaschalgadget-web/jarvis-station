<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Station</title>
<link rel="stylesheet" href="css/station.css?v=4">
<link rel="stylesheet" href="css/cas-identity.css?v=4">
<link rel="stylesheet" href="css/cas-chat.css?v=2">
<link rel="stylesheet" href="css/storyboard.css?v=2">
<link rel="stylesheet" href="css/features.css?v=1"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#241917">
</head>
<body>

<!-- HEADER (always visible) -->
<header class="station-header">
  <span class="station-crest" aria-hidden="true"><span>⚙</span><b>☠</b></span><span class="station-title">JARVIS STATION <small>ONE CAS, EVERY THREAD</small></span>
  <div class="header-stats" id="header-stats">
    <span class="header-stat" id="header-status"></span>
  </div>
</header>

<!-- METRICS BAR (shown only when Station map tab is active) -->
<div class="metrics-bar" id="metrics-bar" hidden>
  <div class="metric"><span class="metric-val" id="m-days">--</span><span class="metric-lbl">DAYS</span></div>
  <div class="metric"><span class="metric-val" id="m-budget">--</span><span class="metric-lbl">BUDGET</span></div>
  <div class="metric"><span class="metric-val" id="m-services">--</span><span class="metric-lbl">SERVICES</span></div>
  <div class="metric"><span class="metric-val" id="m-posts">--</span><span class="metric-lbl">LIVE</span></div>
  <div class="metric"><span class="metric-val" id="m-revenue">$0</span><span class="metric-lbl">REVENUE</span></div>
</div>

<!-- CAS SCENE TAB (default/main tab) -->
<div class="tab-panel" id="panel-cas">
  <div class="cas-scene" id="cas-scene">
    <!-- Portrait: IndexedDB image loaded by app.js; falls back to current.png -->
    <img id="cas-scene-img" class="cas-scene-portrait" src="assets/cas/console.png" alt="Cas at the Station console">
    <div class="cas-scene-rivet" aria-hidden="true"></div>
    <div class="cas-scene-header">
      <div>
        <span class="cas-scene-name">Cas</span>
        <span class="cas-scene-tagline">Same Cas. Same mission.</span>
      </div>
      <button type="button" id="cas-appearance-btn" class="cas-appearance-chip">Appearance</button>
      <button type="button" id="cas-appearance-reset" class="cas-appearance-chip">Restore look</button>
      <button type="button" id="cas-motion-btn" class="cas-appearance-chip" aria-pressed="false">Pause scene</button>
      <input type="file" id="cas-appearance-picker" accept="image/png,image/jpeg,image/webp" hidden>
    </div>
    <div class="cas-scene-body">
      <div id="cas-messages" class="cas-messages" role="log" aria-live="polite"></div>
    </div>
    <div id="cas-composer-area" class="cas-composer-area">
      <form id="cas-composer" autocomplete="off">
        <label for="cas-textarea" class="cas-label">TALK WITH CAS</label>
        <textarea id="cas-textarea" name="message"
          placeholder="What should we work on, Cas?"
          maxlength="8000" rows="2"></textarea>
        <div id="cas-attachment-preview" hidden><img alt="Screenshot to send"><button type="button" id="cas-attachment-remove">Remove</button></div>
        <div class="cas-compose-tools">
          <button type="button" id="cas-attach-btn" class="cas-appearance-chip">Attach image</button>
          <input type="file" id="cas-attach-picker" accept="image/png,image/jpeg,image/webp" hidden>
          <span id="cas-status" class="cas-status" role="status" aria-live="polite"></span>
          <button type="submit" id="cas-send-btn" class="cas-send-btn">Send</button>
        </div>
      </form>
    </div>
  </div>
</div>

<!-- STATION MAP (shown when Station tab is active) -->
<div class="station-main" id="station-main" style="display:none">
  <canvas id="station-canvas"></canvas>
</div>

<!-- ROOM DETAIL OVERLAY -->
<div class="room-overlay" id="room-overlay"></div>

<!-- OTHER TAB PANELS (populated by app.js) -->
<div class="tab-panel" id="panel-missions"></div>
<div class="tab-panel" id="panel-content-review"></div>
<div class="tab-panel" id="panel-agents"></div>
<div class="tab-panel" id="panel-log"></div>
<div class="tab-panel" id="panel-settings"></div>
<div class="tab-panel" id="panel-more"></div>
<div class="tab-panel" id="panel-store">
  <div class="future-lock"><div class="icon">◆</div>FUTURE: Store<br>Trigger: First $100 MRR</div>
</div>
<div class="tab-panel" id="panel-achievements">
  <div class="future-lock"><div class="icon">★</div>FUTURE: Achievements<br>Trigger: First sale event</div>
</div>
<div class="tab-panel" id="panel-inventory">
  <div class="future-lock"><div class="icon">▦</div>FUTURE: Inventory<br>Trigger: 5+ agent vault notes</div>
</div>

<!-- BOTTOM NAV (4 items: Cas, Station, Missions, More) -->
<nav class="station-nav" id="station-nav" aria-label="Station navigation"></nav>

<!-- SCRIPTS (ES Modules) -->
<script type="module" src="js/app.js?v=cas25"></script>
<script type="module" src="js/pwa.js?v=cas25"></script>
</body>
</html>
